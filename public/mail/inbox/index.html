<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inbox</title>
<link rel="icon" href="/assets/powercordkit_logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--b:#5865F2;--bg:#0e0e10;--p:#17171a;--p2:#1e1e22;--bd:#26262b;--t:#f0f0f2;--m:#8a8a90;--h:#232326}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--t);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:54px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--p);flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;color:var(--t)}.logo img{width:28px;height:28px;border-radius:7px}
.nav{display:flex;gap:6px;align-items:center}.pill{padding:6px 12px;border-radius:8px;font-size:12px;color:var(--m);cursor:pointer;border:1px solid transparent;text-decoration:none}.pill.mail{background:var(--b);color:white;border-color:var(--b)}
.main{flex:1;display:flex;overflow:hidden}
.side{width:240px;background:var(--p);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:12px;gap:16px;overflow:auto}
.side h4{margin:0 0 6px 0;font-size:10px;letter-spacing:.1em;color:var(--m);text-transform:uppercase;font-weight:600}
.srv{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px}.srv:hover{background:var(--h)}.srv.active{background:var(--p2);border:1px solid var(--bd)}
.list{width:380px;background:var(--bg);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.list-top{padding:10px;border-bottom:1px solid var(--bd);display:flex;gap:8px}.search{flex:1;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;color:var(--t);font-size:13px;outline:none}.btn{background:var(--b);color:white;border:0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer}
.items{overflow:auto;flex:1}
.item{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--bd);cursor:pointer;position:relative}.item:hover{background:var(--h)}.item.sel{background:var(--p2);border-left:3px solid var(--b)}
.av{width:30px;height:30px;border-radius:50%;background:var(--p2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.meta{font-size:10px;color:var(--m);display:flex;gap:5px;align-items:center;margin-bottom:3px}.badge{padding:2px 6px;border-radius:999px;background:var(--p2);border:1px solid var(--bd);font-size:9px;font-weight:600}
.title{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:2px}.prev{font-size:11px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{flex:1;background:var(--p);display:flex;flex-direction:column;overflow:hidden}
.content{padding:16px;overflow:auto;flex:1}.box{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;margin-bottom:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}.modal.open{display:flex}.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:18px;width:440px}.inp{width:100%;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;color:var(--t);font-size:13px;margin:6px 0 12px 0;outline:none}
.abtn{padding:6px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--p2);color:var(--t);font-size:12px;cursor:pointer}.abtn.prim{background:var(--b);border-color:var(--b);color:white}
.status{font-size:11px;color:var(--m);padding:6px 12px;border-bottom:1px solid var(--bd)}
.origin{font-size:11px;color:var(--m);margin-top:18px;padding-top:10px;border-top:1px solid var(--bd);line-height:1.7}
.orig2{font-size:10px;color:var(--m);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mob-only{display:none!important}
@media(max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;width:270px;max-width:82vw;transform:translateX(-100%);transition:transform .18s ease;border-right:1px solid var(--bd)}
  .side.open{transform:translateX(0)}
  .list{width:100%;border-right:0}
  .detail{position:fixed;inset:0;z-index:65;transform:translateX(100%);transition:transform .18s ease}
  .detail.open{transform:translateX(0)}
  .mob-only{display:inline-flex!important}
  .item{padding:14px 12px}
  .content{padding:14px}
  .orig2{white-space:normal}
  .card{width:auto;max-width:92vw}
  .modal .card{width:92vw}
}
.side-scrim{position:fixed;inset:0;z-index:66;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .18s ease}
.side-scrim.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="pck-nav"></div>
<div class="main">
  <div class="side">
    <div class="mob-only" style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">Filters</b><button class="abtn" id="filters-close">✕ Close</button></div>
    <div><h4>Servers</h4><div id="srv-filters"><div class="srv active" data-server="all"><span>All Servers</span><span id="c-all">–</span></div></div></div>
    <div><h4>Type</h4><div id="type-filters"><div class="srv active" data-type="all"><span>All types</span></div></div></div>
    <div><h4>View</h4><div id="view-filters"><div class="srv active" data-status="open"><span>Open</span></div><div class="srv" data-status="completed"><span>Completed</span></div></div></div>
    <div style="margin-top:auto"><div style="font-size:10px;color:var(--m);line-height:1.6" id="hook-hint">Discourse webhook:<br/>POST /hooks/discourse</div><div style="font-size:10px;margin-top:10px"><a href="https://powercordkit.emjay.fyi" target="_blank" rel="noopener" style="color:var(--m);text-decoration:none">Powered by PowerCordKit</a></div></div>
  </div>
  <div class="mob-only side-scrim" id="side-scrim"></div>
  <div class="list">
    <div class="list-top"><button class="btn mob-only" id="filters-btn" style="flex:0 0 auto">☰</button><input class="search" id="q" placeholder="Search ideas, bugs, tickets…" /><button class="btn" id="new-btn">+ New</button></div>
    <div class="status" id="status">Connecting to API…</div>
    <div class="items" id="items"></div>
  </div>
  <div class="detail" id="detail"><div style="padding:60px 20px;text-align:center;color:var(--m)"><div style="font-size:32px;margin-bottom:12px">📬</div><div style="font-weight:600;color:var(--t)">Unified Mod Inbox</div><div style="font-size:13px;margin-top:6px;max-width:340px;margin:auto;line-height:1.5">Backed by <span id="api-env">Workers + D1</span>. Mail via the + New button (or Discord context menu → <code>/hooks/discord</code>).</div></div></div>
</div>
<div class="modal" id="modal"><div class="card"><h3 style="margin:0 0 4px 0">Mail to Inbox</h3><div style="font-size:12px;color:var(--m);margin-bottom:12px">POST /api/inbox</div>
<input class="inp" id="m-title" value="New idea from forum search" />
<input class="inp" id="m-content" value="Manually mailed — describe the idea, bug, or ticket here." />
<select class="inp" id="m-server"><option>general</option><option>support</option><option>staff</option><option>discourse</option></select>
<select class="inp" id="m-type"><option>idea</option><option>support</option><option>ticket</option><option>mailed</option></select>
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="abtn" id="cancel-btn">Cancel</button><button class="abtn prim" id="send-btn">Mail to Inbox</button></div></div></div>
<script>
let data = [], sel = null, fS = 'all', fT = 'all', fStatus = 'open', serversCache = [];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Render a safe subset of Discord markdown: bold/italic/underline/strike,
// spoiler, inline code, code blocks, blockquotes, headings, and links.
function md(input) {
  let out = esc(input || '');
  const blocks = [];
  out = out.replace(/```([\s\S]*?)```/g, (m, code) => {
    blocks.push(code.replace(/^[a-zA-Z0-9]*\n/, ''));
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  out = out.replace(/`([^`\n]+)`/g, '<code style="background:#111;padding:1px 5px;border-radius:4px">$1</code>');
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#5865F2">$1</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  out = out.replace(/__([^_]+)__/g, '<u>$1</u>');
  out = out.replace(/~~([^~]+)~~/g, '<s>$1</s>');
  out = out.replace(/\|\|([^|]+)\|\|/g, '<span style="background:#2a2a2e;border-radius:3px;padding:0 2px">$1</span>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  out = out.replace(/(^|[^_])_([^_\n]+)_/g, '$1<i>$2</i>');
  out = out.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener" style="color:#5865F2">$2</a>');
  out = out.replace(/^#{1,6}\s*(.+)$/gm, '<b style="font-size:15px">$1</b>');
  out = out.replace(/^&gt;\s?(.*)$/gm, '<span style="color:#9aa0a8;border-left:3px solid #444;padding-left:8px;display:inline-block">$1</span>');
  out = out.replace(/\n/g, '<br>');
  out = out.replace(/\u0000(\d+)\u0000/g, (m, i) => '<pre style="background:#111;padding:8px;border-radius:6px;overflow:auto;white-space:pre-wrap">' + blocks[i] + '</pre>');
  return out;
}
// Mod-key gate: when the Worker sets MOD_API_KEY, /api/* (except /health)
// needs X-Mod-Key. Prompt once per session, keep it out of URLs/storage.
async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers, { 'X-Mod-Key': sessionStorage.getItem('pck-mod-key') || '' });
  let r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    let info = {};
    try { info = await r.clone().json(); } catch (e) {}
    if (info.login) { window.__pckLogin = true; return r; }
    if (info.error === 'Mod key required') {
      const k = prompt('This inbox needs a mod key:');
      if (k) {
        sessionStorage.setItem('pck-mod-key', k);
        headers['X-Mod-Key'] = k;
        r = await fetch(path, Object.assign({}, opts, { headers }));
      } else {
        window.__pckLocked = true;
      }
    }
  }
  return r;
}

// Filters come from the live registry (GET /api/servers) so the sidebar only
// ever shows servers/types that actually have data — no phantom filters that
// empty the list when clicked. Static HTML above is just the pre-load skeleton.
function renderFilters(servers, types) {
  serversCache = servers || [];
  const box = $('srv-filters');
  if (box && serversCache.length) {
    const shown = serversCache.filter((s) => s.count > 0);
    if (fS !== 'all' && !shown.some((s) => s.server === fS)) fS = 'all';
    const total = serversCache.reduce((a, s) => a + s.count, 0);
    box.innerHTML = '<div class="srv' + (fS === 'all' ? ' active' : '') + '" data-server="all"><span>All Servers</span><span id="c-all">' + total + '</span></div>' +
      shown.map((s) => '<div class="srv' + (fS === s.server ? ' active' : '') + '" data-server="' + esc(s.server) + '"><span>' + esc(s.server) + (s.locked ? ' 🔒' : '') + '</span><span>' + s.count + '</span></div>').join('');
    const selEl = $('m-server');
    if (selEl) {
      const cur = selEl.value;
      const names = serversCache.map((s) => s.server);
      selEl.innerHTML = names.map((n) => '<option' + (n === cur ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
      if (!names.includes(cur) && cur) selEl.innerHTML += '<option selected>' + esc(cur) + '</option>';
    }
  }
  const tbox = $('type-filters');
  if (tbox) {
    const list = (types || []).filter((t) => t.count > 0);
    if (fT !== 'all' && !list.some((t) => t.type === fT)) fT = 'all';
    const total = list.reduce((a, t) => a + t.count, 0);
    tbox.innerHTML = '<div class="srv' + (fT === 'all' ? ' active' : '') + '" data-type="all"><span>All types</span><span>' + total + '</span></div>' +
      list.map((t) => '<div class="srv' + (fT === t.type ? ' active' : '') + '" data-type="' + esc(t.type) + '"><span>' + esc(t.type) + '</span><span>' + t.count + '</span></div>').join('');
  }
}

async function load() {
  $('status').textContent = 'Loading inbox…';
  try {
    const params = new URLSearchParams();
    if (fS !== 'all') params.set('server', fS);
    if (fT !== 'all') params.set('type', fT);
    if (fStatus === 'completed') params.set('status', 'completed');
    const q = $('q').value.trim();
    if (q) params.set('q', q);
    const r = await api('/api/inbox?' + params.toString());
    if (!r.ok) { const e2 = new Error('API ' + r.status); e2.status = r.status; throw e2; }
    const j = await r.json();
    data = j.items || [];
    $('status').textContent = data.length + ' items • Workers + D1 • E to complete';
    api('/api/servers').then((r) => r.json()).then((sj) => renderFilters(sj.servers || [], sj.types || [])).catch(() => {});
    const h = await fetch('/api/health', { cache: 'no-store' }).then(x=>x.json()).catch(()=>null);
    if (h) { if (window.PCK) window.PCK.right('<span class="pill">' + (h.env || 'personal') + '</span>'); $('api-env').textContent = (h.env === 'community' ? 'mod.tep.one' : 'powercordkit.emjay.fyi') + ' (Workers + D1)'; $('hook-hint').innerHTML = 'Discourse webhook:<br/>POST ' + (h.env === 'community' ? 'https://mod.tep.one/hooks/discourse' : 'https://powercordkit.emjay.fyi/hooks/discourse'); }
  } catch (e) {
    // Never show fake items: this inbox only ever renders real API data.
    const code = (e && e.status) ? ('API ' + e.status) : 'API offline';
    $('status').textContent = window.__pckLogin ? 'Signed out' : ('Locked — ' + code);
    $('items').innerHTML = '';
    $('detail').innerHTML = window.__pckLogin
      ? '<div style="padding:60px 20px;text-align:center;color:var(--m)"><div style="font-size:32px;margin-bottom:12px">🔒</div><div style="font-weight:600;color:var(--t)">Signed out</div><div style="font-size:13px;margin:8px auto;max-width:320px;line-height:1.5">Log in with Discord to load the inbox.</div><a href="/api/auth/login" style="display:inline-block;margin-top:10px;background:#5865F2;color:#fff;text-decoration:none;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700">Log in with Discord</a><div style="margin-top:10px;font-size:11px;opacity:.6">' + code + '</div></div>'
      : '<div style="padding:60px 20px;text-align:center;color:var(--m)"><div style="font-size:32px;margin-bottom:12px">🔒</div><div style="font-weight:600;color:var(--t)">Mod key required</div><div style="font-size:13px;margin:8px auto;max-width:320px;line-height:1.5">This inbox is private. Enter the mod key to load real items — no sample data is ever shown.</div><button class="unlock-btn" style="margin-top:10px;background:#5865F2;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer">Enter mod key</button><div style="margin-top:10px;font-size:11px;opacity:.6">' + code + '</div></div>';
    document.querySelectorAll('.unlock-btn').forEach((b) => b.onclick = () => { window.__pckLocked = false; sessionStorage.removeItem('pck-mod-key'); load(); });
    render();
    return;
  }
  render();
}

function render() {
  const c = $('items');
  if (!c) return;
  c.innerHTML = '';
  const ca = $('c-all');
  if (ca) ca.textContent = data.length;
  if (data.length === 0) {
    c.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--m)"><div style="font-size:26px;margin-bottom:8px">🔍</div><div style="font-size:13px">No items match this filter.</div><button class="abtn" id="clear-filters" style="margin-top:10px">Show all</button></div>';
    const cb = $('clear-filters');
    if (cb) cb.onclick = () => { fS = 'all'; fT = 'all'; fStatus = 'open'; $('q').value = ''; document.querySelectorAll('[data-server],[data-type],[data-status]').forEach((x) => x.classList.remove('active')); document.querySelector('[data-server="all"]')?.classList.add('active'); document.querySelector('[data-type="all"]')?.classList.add('active'); document.querySelector('[data-status="open"]')?.classList.add('active'); load(); };
    return;
  }
  data.forEach((d) => {
    const el = document.createElement('div');
    el.className = 'item' + (sel && sel.id === d.id ? ' sel' : '');
    const tAg = (d.tag && d.tag.toLowerCase() !== (d.type || '').toLowerCase()) ? '<span class="badge">' + esc(d.tag) + '</span>' : '';
    el.innerHTML = '<div class="av">' + esc((d.author || '?')[0].toUpperCase()) + '</div><div style="flex:1;min-width:0">' +
      '<div class="meta"><span class="badge">' + esc(d.type || d.src) + '</span>' + tAg + (d.assigned ? '<span class="badge">👤 ' + esc(d.assigned) + '</span>' : '') + '<span style="margin-left:auto">' + esc(d.time || '') + '</span></div>' +
      '<div class="title">' + esc(d.title) + '</div>' +
      '<div class="prev">' + esc((d.content || '').slice(0, 75)) + '...</div>' +
      '<div class="orig2">' + esc(d.author || 'unknown') + ' • ' + esc(d.server) + ' • ' + esc(d.src) + '</div>' +
      '</div>';
    el.onclick = () => select(d.id);
    c.appendChild(el);
  });
}

function select(id) {
  sel = data.find((d) => String(d.id) === String(id));
  if (!sel) return;
  render();
  const det = $('detail');
  det.classList.add('open');
  const isTag = sel.tag && sel.tag.toLowerCase() !== (sel.type || '').toLowerCase();
  det.innerHTML =
    '<div style="padding:14px;border-bottom:1px solid #26262b;display:flex;justify-content:space-between;align-items:flex-start">' +
      '<div style="display:flex;align-items:flex-start;gap:8px"><button class="abtn mob-only" id="back-btn" style="margin-top:2px;flex:0 0 auto">←</button><div><div><span class="badge">' + esc(sel.type || sel.src) + '</span>' + (isTag ? ' <span class="badge">' + esc(sel.tag) + '</span>' : '') + (sel.assigned ? ' <span class="badge">👤 ' + esc(sel.assigned) + '</span>' : '') + '</div><div style="font-size:11px;color:var(--m);margin-top:6px">' + esc(sel.time || '') + '</div></div></div>' +
      '<div>' + (sel.archived ? '<button class="abtn prim" id="arch-btn">Reopen</button>' : '<button class="abtn prim" id="arch-btn">Complete (E)</button>') + ' <button class="abtn" id="jump-btn">Jump ↗</button></div>' +
    '</div>' +
    '<div class="content">' +
      '<h2 style="font-size:18px;margin:0 0 10px 0">' + esc(sel.title) + '</h2>' +
      '<div class="box">' + md(sel.content) + '</div>' +
      '<div id="notes">' + (sel.notes || []).map((n) => '<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #26262b"><div class="av" style="width:22px;height:22px">' + esc((n.by || '?')[0]) + '</div><div><b style="font-size:12px">' + esc(n.by) + '</b><div style="font-size:13px">' + esc(n.text) + '</div></div></div>').join('') + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:10px"><input class="search" id="note-inp" placeholder="Add private note…" /><button class="abtn prim" id="note-btn">Add</button></div>' +
      '<div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px">' +
        '<span style="color:var(--m)">Roadmap</span>' +
        '<select id="rm-status" class="abtn" style="padding:4px 8px">' +
          [['planned','Planned'],['in-progress','In Progress'],['shipped','Shipped']].map(function (o) { return '<option value="' + o[0] + '"' + (((sel.roadmap_status || 'planned') === o[0]) ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
        '</select>' +
        '<input id="rm-date" type="date" class="abtn" value="' + esc(sel.roadmap_date || '') + '" style="padding:3px 6px" />' +
        '<button class="abtn prim" id="rm-save">' + (sel.roadmap ? 'Update' : 'Add to roadmap') + '</button>' +
        (sel.roadmap ? '<button class="abtn" id="rm-remove">Remove</button>' : '') +
      '</div>' +
      '<div class="origin">Posted by <b style="color:var(--t)">' + esc(sel.author || 'unknown') + '</b> • From ' + esc(sel.server) + ' (' + esc(sel.src) + ') • Mailed by ' + esc(sel.by) + ' • <a href="#" id="assign-link" style="color:#5865F2">assign to me</a>' + (sel.url && sel.url !== '#' ? ' • <a href="' + esc(sel.url) + '" target="_blank" rel="noopener" style="color:#5865F2">Open in Discord ↗</a>' : '') + '</div>' +
    '</div>';
  $('arch-btn').onclick = () => (sel.archived ? reopen(sel.id) : complete(sel.id));
  $('jump-btn').onclick = () => { if (sel.url && sel.url !== '#') window.open(sel.url, '_blank', 'noopener'); };
  $('assign-link').onclick = (e) => { e.preventDefault(); assign(sel.id, '@me'); };
  $('note-btn').onclick = () => addNote(sel.id);
  $('rm-save').onclick = () => roadmapSave(sel.id);
  const rmv = $('rm-remove');
  if (rmv) rmv.onclick = () => roadmapRemove(sel.id);
  const back = $('back-btn');
  if (back) back.onclick = () => { sel = null; $('detail').classList.remove('open'); render(); };
}

async function roadmapSave(id) {
  const status = $('rm-status').value;
  const date = $('rm-date').value;
  try { await api('/api/inbox/' + encodeURIComponent(id) + '/roadmap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status, date }) }); } catch {}
  await load();
  select(id);
}

async function roadmapRemove(id) {
  try { await api('/api/inbox/' + encodeURIComponent(id) + '/roadmap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roadmap: false }) }); } catch {}
  await load();
  select(id);
}

async function complete(id) {
  try { await api('/api/inbox/' + encodeURIComponent(id) + '/complete', { method: 'POST' }); } catch {}
  data = data.filter((d) => String(d.id) !== String(id));
  sel = null;
  $('detail').innerHTML = '<div style="padding:60px;text-align:center;color:var(--m)">Completed • cleared from dashboard 🎉</div>';
  render();
  load();
}

async function reopen(id) {
  try { await api('/api/inbox/' + encodeURIComponent(id) + '/reopen', { method: 'POST' }); } catch {}
  data = data.filter((d) => String(d.id) !== String(id));
  sel = null;
  $('detail').innerHTML = '<div style="padding:60px;text-align:center;color:var(--m)">Reopened • back on the dashboard</div>';
  render();
  load();
}

async function addNote(id) {
  const inp = $('note-inp');
  if (!inp || !inp.value.trim()) return;
  try {
    await api('/api/inbox/' + encodeURIComponent(id) + '/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ by: 'you', text: inp.value }) });
  } catch {}
  await load();
  if (id) select(id);
}

async function assign(id, who) {
  try { await api('/api/inbox/' + encodeURIComponent(id) + '/assign', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ assigned: who }) }); } catch {}
  await load();
  select(id);
}

async function addItem() {
  const payload = { title: $('m-title').value, content: $('m-content').value, server: $('m-server').value, type: $('m-type').value, src: $('m-server').value === 'discourse' ? 'discourse' : 'discord', by: 'you', author: 'you' };
  try {
    const r = await api('/api/inbox', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json();
    closeM(); await load(); if (j.item) select(j.item.id);
  } catch (e) { alert('API offline — start wrangler dev first'); }
}

function openM() { $('modal').classList.add('open'); }
function closeM() { $('modal').classList.remove('open'); }
$('new-btn').onclick = openM; $('cancel-btn').onclick = closeM; $('send-btn').onclick = addItem;
$('q').addEventListener('input', () => load());
const sideEl = document.querySelector('.side');
const sideScrim = $('side-scrim');
function closeDrawer() { sideEl.classList.remove('open'); if (sideScrim) sideScrim.classList.remove('open'); }
const fbtn = $('filters-btn');
if (fbtn) fbtn.onclick = () => { sideEl.classList.toggle('open'); if (sideScrim) sideScrim.classList.toggle('open'); };
const fclose = $('filters-close');
if (fclose) fclose.onclick = closeDrawer;
if (sideScrim) sideScrim.onclick = closeDrawer;
sideEl.addEventListener('click', (e) => {
  const el = e.target.closest ? e.target.closest('[data-server],[data-type],[data-status]') : null;
  if (!el) return;
  const srv = el.dataset.server, typ = el.dataset.type, st = el.dataset.status;
  if (srv !== undefined) { document.querySelectorAll('[data-server]').forEach((x) => x.classList.remove('active')); el.classList.add('active'); fS = srv; }
  if (typ !== undefined) { document.querySelectorAll('[data-type]').forEach((x) => x.classList.remove('active')); el.classList.add('active'); fT = typ; }
  if (st !== undefined) { document.querySelectorAll('[data-status]').forEach((x) => x.classList.remove('active')); el.classList.add('active'); fStatus = st; sel = null; }
  closeDrawer();
  load();
});
document.addEventListener('keydown', (e) => { if (e.key === 'e' || e.key === 'E') { if (sel && document.activeElement.tagName !== 'INPUT') { sel.archived ? reopen(sel.id) : complete(sel.id); } } if (e.key === 'Escape') closeM(); });
load();
</script>
<script src="/assets/site.js"></script>
</body>
</html>
