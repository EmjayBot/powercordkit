<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roadmap</title>
<link rel="icon" href="/assets/powercordkit_logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--b:#5865F2;--bg:#0e0e10;--p:#17171a;--p2:#1e1e22;--bd:#26262b;--t:#f0f0f2;--m:#8a8a90;--planned:#8a8a90;--progress:#faa61a;--shipped:#3ba55d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--t)}
.top{height:54px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--p)}
.top a{color:var(--t);text-decoration:none;font-weight:700;font-size:15px}.top img{width:28px;height:28px;border-radius:7px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--m);font-size:13px;margin-bottom:22px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:14px;min-height:120px}
.col h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.col h2 .count{margin-left:auto;color:var(--m);font-size:11px;font-weight:600}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.card .date{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.card .title{font-size:13.5px;font-weight:600;margin-bottom:5px;line-height:1.35}
.card .body{font-size:12px;color:var(--m);white-space:pre-wrap;line-height:1.5}
.card .who{font-size:10px;color:var(--m);margin-top:8px;border-top:1px solid var(--bd);padding-top:6px;display:flex;justify-content:space-between;gap:8px}
.card a{color:#5865F2;text-decoration:none}
.empty{color:var(--m);font-size:12px;padding:8px 2px}
</style>
</head>
<body>
<div id="pck-nav"></div>
<div class="wrap">
  <h1>Roadmap</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="board">
    <div class="col" id="col-planned"><h2><span class="dot" style="background:var(--planned)"></span>Planned<span class="count" id="n-planned"></span></h2><div id="planned"></div></div>
    <div class="col" id="col-progress"><h2><span class="dot" style="background:var(--progress)"></span>In Progress<span class="count" id="n-progress"></span></h2><div id="progress"></div></div>
    <div class="col" id="col-shipped"><h2><span class="dot" style="background:var(--shipped)"></span>Shipped<span class="count" id="n-shipped"></span></h2><div id="shipped"></div></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (d) => { if (!d) return ''; const t = Date.parse(d); if (isNaN(t)) return esc(d); return new Date(t).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); };
function bucket(s){ s=(s||'planned').toLowerCase(); if (s.includes('progress')||s.includes('doing')||s.includes('active')) return 'progress'; if (s.includes('ship')||s.includes('done')||s.includes('complete')) return 'shipped'; return 'planned'; }
function card(d){
  return '<div class="card">' + (d.roadmap_date ? '<div class="date">'+fmtDate(d.roadmap_date)+'</div>' : '') +
    '<div class="title">' + esc(d.title) + '</div>' +
    (d.content ? '<div class="body">' + esc(d.content).slice(0,300) + '</div>' : '') +
    '<div class="who"><span>' + esc(d.author || 'unknown') + (d.server ? ' • ' + esc(d.server) : '') + '</span>' +
    (d.url && d.url !== '#' ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">Open ↗</a>' : '') + '</div></div>';
}
async function load(){
  try {
    const r = await fetch('/api/roadmap', { cache: 'no-store' });
    const j = await r.json();
    const items = j.items || [];
    const groups = { planned: [], progress: [], shipped: [] };
    items.forEach((d) => groups[bucket(d.roadmap_status)].push(d));
    for (const k of ['planned','progress','shipped']) {
      $(k).innerHTML = groups[k].length ? groups[k].map(card).join('') : '<div class="empty">Nothing here yet.</div>';
      $('n-' + k).textContent = groups[k].length;
    }
    $('sub').textContent = items.length + ' item' + (items.length === 1 ? '' : 's') + ' • updated ' + new Date().toLocaleDateString();
  } catch (e) {
    $('sub').textContent = 'Could not load the roadmap.';
  }
}
load();
</script>
<div id="pck-foot"></div>
<script src="/assets/site.js"></script>
</body>
</html>
